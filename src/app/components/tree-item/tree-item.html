<div class="tree-item-container">
    <div class="tree-icon-container">
        <span *ngIf="hasChildren">{{ expanded ? '-' : '+' }}</span>
    </div>
    <a class="nav-item" [routerLink]="hasLink ? link : null" [ngClass]="{'active': isActive}" (click)="toggle()">
        {{ displayName }}
    </a>
</div>
<div *ngIf="hasChildren" class="sub-menu" [ngClass]="{'expanded': expanded}">
    <ul>
        <ng-content></ng-content>
    </ul>
</div>
