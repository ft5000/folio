<ng-container *ngIf="project">
    <div class="project-column">
        <ng-container *ngIf="!(loading$ | async)">
            <!-- <div *ngIf="headerImage?.imageUrl" class="image-header">
                <img [src]="headerImage!.imageUrl" [alt]="project.title" />
            </div> -->
            <div class="text-container" [class.fade-in]="isAnimating">
                <section>
                    <h3>{{project.title.toUpperCase()}}</h3>
                    <div class="section-body">
                        <div class="text-body">
                            <ng-container *ngFor="let block of project?.description">
                                <p *ngIf="block._type === 'block'">
                                    <ng-container *ngFor="let child of block.children">
                                        <span [innerHTML]="renderSpan(child, block)"></span>
                                    </ng-container>
                                </p>
                            </ng-container>
                        </div>
                        <div class="meta">
                            <ng-container *ngFor="let tag of project?.tags">
                                <span>{{tag.toUpperCase()}}</span>
                            </ng-container>
                        </div>
                    </div>
                </section>
                <section *ngIf="projectImages && projectImages.length > 0" class="image-container">
                    <h3>MEDIA</h3>
                    <div class="section-body">
                        <button class="btn-toggle" (click)="toggleImages()">
                            {{ showImages ? '- HIDE IMAGES' : '+ SHOW IMAGES' }}
                        </button>
                        <div class="project-images" #imagesContainer>
                            <grid [maxCols]="2">
                                <ng-template *ngFor="let image of projectImages">
                                    <grid-item [image]="image" [showDefault]="true" [showPublishDate]="false"></grid-item>
                                </ng-template>
                            </grid>
                        </div>
                    </div>
                </section>
            </div>
        </ng-container>
    </div>
</ng-container>

<ng-container *ngIf="!(loading$ | async) && notFound">
    <img src="images/fly_1.gif" alt="not found" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);"/>
</ng-container>
