<cursor *ngIf="!isMobile && !useMobileLayout"></cursor>
<nav-bar *ngIf="isMobile || useMobileLayout"></nav-bar>
<span *ngIf="loading$ | async" class="loader"></span>
<img class="arrow-down" [ngClass]="{'show': canScrollDown}" src="images/arrow_down_1.png"/>
<div class="gradient" [ngClass]="{'show': canScrollDown && isMobile}"></div>
<div class="site-container" style="display: flex; flex-direction: row;">
  <main class="main">
    <div class="main-container">
      <div *ngIf="!isMobile && !useMobileLayout" class="nav-container">
        <div style="width: 80%;">
          <nav-links></nav-links>
        </div>
      </div>
      <div class="router-container" #routerContainer [@routeFadeIn]="currentRoute">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
  <!-- <background></background> -->
</div>
